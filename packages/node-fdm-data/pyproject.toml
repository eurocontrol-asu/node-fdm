[project]
name = "node-fdm-data"
dynamic = ["version"]
description = "Flight data processing, physics, conversions, and schemas for node-fdm"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }
authors = [{ name = "Gabriel Jarry", email = "gabriel.jarry@eurocontrol.int" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/node_fdm_data"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--import-mode=importlib",
    "--cov=src/node_fdm_data",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]
filterwarnings = ["error"]
