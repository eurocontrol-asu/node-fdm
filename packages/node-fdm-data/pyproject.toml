[project]
name = "node-fdm-data"
dynamic = ["version"]
description = "Flight data processing, physics, conversions, and schemas for node-fdm"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }
authors = [{ name = "Gabriel Jarry", email = "gabriel.jarry@eurocontrol.int" }]
keywords = ["flight-dynamics", "physics", "isa", "polars", "aviation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/axm-fdm-workspace"
Documentation = "https://eurocontrol-asu.github.io/axm-fdm-workspace/"
Repository = "https://github.com/eurocontrol-asu/axm-fdm-workspace.git"
Issues = "https://github.com/eurocontrol-asu/axm-fdm-workspace/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/node_fdm_data"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--import-mode=importlib",
    "--cov=src/node_fdm_data",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]
exclude = ["*/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "C4", "S", "T20", "PLR", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["node_fdm_data"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["scipy.*", "polars.*"]
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["node_fdm_data"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.xml]
output = "coverage.xml"
