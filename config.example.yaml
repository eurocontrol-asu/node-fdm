# node-fdm-v2 pipeline configuration
# Copy to config.yaml and adjust paths for your machine:
#   cp config.example.yaml config.yaml

paths:
  data_dir: "/path/to/your/data"       # ← CHANGE THIS (absolute path)
  preprocess_dir: "preprocessed_parquet"
  era5_cache_dir: "era5_cache"

era5_features:
  - u_component_of_wind
  - v_component_of_wind
  - temperature

typecodes:
  - A320
  - A20N
  - A321
  - A21N
  - B738
  - B38M
  - E190
  - E195
  - A319
  - A332
  - A333

computing:
  default_cpu_count: 35

# Training-time toggles forwarded to node_fdm.trainer.TrainingConfig.
# Why: rebalances the trajectory loss across flight modes (TURN vs straight
# segments) using effective-number sample weights when modes are imbalanced.
# How: enable when training data is heavily skewed toward cruise; the CLI
# flag --use-mode-weights / --no-use-mode-weights overrides this value.
training:
  use_mode_weights: false

bada:
  bada_4_2_dir: "/path/to/BADA/4.2.1"  # ← CHANGE THIS (if using BADA)

# Selected-parameter filter thresholds (v2 defaults below).
# Uncomment and modify to override.
# selected_params:
#   mach:
#     tol: 0.0005
#     min_len: 120
#     alt_threshold: 15000
#   cas:
#     tol: 0.75
#   vz:
#     min_abs_value: 75

# V3 turn-detector hyperparameters (AXM-1706). Defaults reproduce the
# pre-config behaviour bit-for-bit; uncomment to override.
# lateral_detection:
#   bilateral_sigma_s: 8.0    # spatial sigma of the bilateral smoother (samples)
#   bilateral_sigma_r: 0.01   # range sigma of the bilateral smoother (deg/s)
#   bilateral_passes: 2       # number of bilateral smoothing passes (>= 1)
#   rate_threshold: 0.05      # peak detection threshold (deg/s)
