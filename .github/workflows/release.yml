name: Release

on:
  push:
    tags:
      - "data/v*"
      - "fdm/v*"
      - "bada/v*"

permissions:
  contents: write

jobs:
  release:
    name: Generate Changelog & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect package from tag
        id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREFIX="${TAG%%/*}"
          if [[ "$TAG" == data/* ]]; then
            echo "package=node-fdm-data" >> "$GITHUB_OUTPUT"
            echo "package-dir=packages/node-fdm-data" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == fdm/* ]]; then
            echo "package=node-fdm" >> "$GITHUB_OUTPUT"
            echo "package-dir=packages/node-fdm" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == bada/* ]]; then
            echo "package=node-fdm-bada" >> "$GITHUB_OUTPUT"
            echo "package-dir=packages/node-fdm-bada" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown tag prefix: $TAG"
            exit 1
          fi
          echo "tag-prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ steps.detect.outputs.package-dir }}/pyproject.toml
          args: >-
            --latest
            --strip header
            --tag-pattern '${{ steps.detect.outputs.tag-prefix }}/v*'
            --include-path '${{ steps.detect.outputs.package-dir }}/**'
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          token: ${{ secrets.GITHUB_TOKEN }}
