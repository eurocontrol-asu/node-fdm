[project]
name = "node-fdm-workspace"
version = "0.0.0"
description = "Physics-guided Neural ODE framework for aircraft flight dynamics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }
authors = [{ name = "Gabriel Jarry", email = "gabriel.jarry@eurocontrol.int" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "node-fdm-data",
    "node-fdm",
    "node-fdm-bada",
    "node-fdm-pipeline",
    "matplotlib>=3.10.8",
    "traffic>=2.10",
    "pygeomag>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/axm-fdm-workspace"
Documentation = "https://eurocontrol-asu.github.io/axm-fdm-workspace/"
Repository = "https://github.com/eurocontrol-asu/axm-fdm-workspace.git"
Issues = "https://github.com/eurocontrol-asu/axm-fdm-workspace/issues"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
node-fdm-data = { workspace = true }
node-fdm = { workspace = true }
node-fdm-bada = { workspace = true }
node-fdm-pipeline = { workspace = true }

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["packages/*/src", "packages/*/tests"]
exclude = ["*/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "S", "T20", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
"scripts/**" = ["T201", "N999", "N806", "S110"]

[tool.ruff.lint.isort]
known-first-party = ["node_fdm_data", "node_fdm", "node_fdm_bada", "node_fdm_pipeline"]

[tool.pytest.ini_options]
testpaths = ["packages/node-fdm-data/tests", "packages/node-fdm/tests", "packages/node-fdm-bada/tests", "packages/node-fdm-pipeline/tests"]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source_pkgs = ["node_fdm_data", "node_fdm", "node_fdm_bada", "node_fdm_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# mypy is configured per-package under packages/*/pyproject.toml.
# This root config only covers scripts/ (one-off diagnostic utilities,
# exempted from strict typing per CLAUDE.md).
[tool.mypy]
python_version = "3.12"
files = ["scripts"]
ignore_missing_imports = true
ignore_errors = true
