[project]
name = "node-fdm-workspace"
version = "0.0.0"
description = "Physics-guided Neural ODE framework for aircraft flight dynamics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }
authors = [{ name = "Gabriel Jarry", email = "gabriel.jarry@eurocontrol.int" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "node-fdm-data",
    "node-fdm",
    "node-fdm-models",
    "node-fdm-bada",
    "node-fdm-pipeline",
    "matplotlib>=3.10.8",
    "traffic>=2.10",
    "pygeomag>=1.1.0",
    "ruptures>=1.1.10",
    "rs1090>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/axm-fdm-workspace"
Documentation = "https://eurocontrol-asu.github.io/axm-fdm-workspace/"
Repository = "https://github.com/eurocontrol-asu/axm-fdm-workspace.git"
Issues = "https://github.com/eurocontrol-asu/axm-fdm-workspace/issues"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
node-fdm-data = { workspace = true }
node-fdm = { workspace = true }
node-fdm-models = { workspace = true }
node-fdm-bada = { workspace = true }
node-fdm-pipeline = { workspace = true }

[dependency-groups]
dev = [
    "prek>=0.4.9",
    "mypy>=1.13",
    "scikit-learn>=1.8.0",
    "optuna>=4.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["packages/*/src", "packages/*/tests"]
exclude = ["*/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "S", "T20", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
# Paper analysis drivers: CLI prints, module-alias capitals like
# `import detectors as D`, subprocess orchestration.
"papers/**" = ["T201", "N999", "N806", "N812", "N811", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["node_fdm_data", "node_fdm", "node_fdm_models", "node_fdm_bada", "node_fdm_pipeline"]

[tool.pytest.ini_options]
testpaths = ["packages/node-fdm-data/tests", "packages/node-fdm/tests", "packages/node-fdm-models/tests", "packages/node-fdm-bada/tests", "packages/node-fdm-pipeline/tests"]
# No `pythonpath = ["."]`: it made every package's tests/ resolve to the same
# top-level `tests` package, so the second conftest.py collected raised
# "Plugin already registered under a different name". Each package is installed
# in the workspace venv, so its own tests import it without a path hack.
#
# The one leaf dir below is safe for the same reason `["."]` was not: it adds a
# single package's tests/ so its `_config_fixtures` helper is importable, rather
# than a parent under which every tests/ resolves to one `tests` package.
pythonpath = ["packages/node-fdm-pipeline/tests"]
consider_namespace_packages = true
addopts = "-q --import-mode=importlib"
# Mirrors the per-package markers: this root config fully replaces them when
# pytest runs from the workspace root, and --strict-markers is on per package.
markers = [
    "integration: integration tests with real I/O or public-API scenarios",
    "e2e: end-to-end subprocess/CLI tests",
]

[tool.coverage.run]
source_pkgs = ["node_fdm_data", "node_fdm", "node_fdm_models", "node_fdm_bada", "node_fdm_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# mypy is configured per-package under packages/*/pyproject.toml, and
# `make typecheck` runs it there. This root block only carries the shared
# defaults; it declares no `files` on purpose, since the only non-package
# Python left at the root is papers/, a submodule with its own tooling that is
# empty in a clone without --recurse-submodules.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
ignore_errors = true
